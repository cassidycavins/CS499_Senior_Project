
{% extends "base.html" %}

{% block title %}
Extracted Text - AI Study Planner
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h1 class="mb-3">Extracted PDF Text</h1>

    <p class="text-muted">
        Course: {{ course.name }}
    </p>

    <div class="card mb-4">

        <div class="card-header">
            <strong>{{ material.filename }}</strong>
        </div>

        <div class="card-body">

            <p class="text-muted">
                This text was extracted from your
                uploaded study material.
            </p>

            <div
                class="border rounded p-3 bg-light"
                style="white-space: pre-wrap; overflow-wrap: anywhere;"
            >{{ extracted_text }}</div>

        </div>

    </div>

    <a
        href="/courses/{{ course.id }}"
        class="btn btn-secondary"
    >
        Back to Course
    </a>

</div>

{% endblock %}
